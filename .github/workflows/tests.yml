name: Unit Tests
on:
  push:
    branches: [main, gpu/alpaka]
  pull_request:
  issue_comment:
    types: [created]
  workflow_dispatch:
concurrency:
  group: tests-${{ github.event.issue.number || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    name: Authorize
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(fromJSON('["sanjibansg","lmoneta"]'), github.event.comment.user.login) &&
        startsWith(github.event.comment.body, '/runtest')
      )
    environment: >-
      ${{
        (github.event_name == 'pull_request' && !contains(fromJSON('["main","gpu/alpaka"]'), github.base_ref))
        && 'ci-tests-approval'
        || 'ci-open'
      }}
    steps:
      - name: React to trigger comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });
      - name: Authorized
        run: echo "Authorized to run GPU tests"
  tests-h100:
    name: Attempt on h100
    needs: gate
    uses: ./.github/workflows/_gpu-tests-run.yml
    continue-on-error: true
    with:
      runner_label: ml4ep-h100
      checkout_ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.ref }}

  tests-h100-47gb:
    name: Attempt on h100-47gb
    needs: [gate, tests-h100]
    if: always() && needs.gate.result == 'success' && needs.tests-h100.result == 'failure'
    uses: ./.github/workflows/_gpu-tests-run.yml
    continue-on-error: true
    with:
      runner_label: ml4ep-h100-47gb
      checkout_ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.ref }}

  tests-l40s:
    name: Attempt on l40s
    needs: [gate, tests-h100, tests-h100-47gb]
    if: >-
      always() && needs.gate.result == 'success' &&
      needs.tests-h100.result == 'failure' &&
      needs.tests-h100-47gb.result == 'failure'
    uses: ./.github/workflows/_gpu-tests-run.yml
    with:
      runner_label: ml4ep-l40s
      checkout_ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.ref }}

  report:
    name: Report result on PR
    runs-on: ubuntu-latest
    needs: [gate, tests-h100, tests-h100-47gb, tests-l40s]
    if: always() && github.event_name == 'issue_comment'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const results = [
              '${{ needs.tests-h100.result }}',
              '${{ needs.tests-h100-47gb.result }}',
              '${{ needs.tests-l40s.result }}',
            ];
            const status = results.includes('success') ? '✅ passed' : '❌ failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `/runtest: GPU Unit Tests ${status} — [view run](${runUrl})`
            });
